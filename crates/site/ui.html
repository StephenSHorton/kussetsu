<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>kussetsu/ui</title>
    <meta name="theme-color" content="#050806" />
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #050806;
        overflow: hidden;
      }
      canvas#gpu {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        outline: none;
      }
      canvas#gpu:focus { outline: none; }
    </style>
  </head>
  <body>
    <script>window.__kussetsuCatalog = true;</script>
    <canvas id="gpu" data-catalog tabindex="0"></canvas>
    <script type="module">
      const canvas = document.getElementById("gpu");
      canvas.addEventListener(
        "wheel",
        (e) => {
          if (e.ctrlKey || e.metaKey) e.preventDefault();
        },
        { passive: false },
      );
      canvas.addEventListener("keydown", (e) => {
        if (e.key === "Tab") e.preventDefault();
        if ((e.metaKey || e.ctrlKey) && (e.key === "k" || e.key === "K")) e.preventDefault();
      });
      canvas.focus();
      import init, { start_kussetsu } from "./kussetsu_site.js";
      console.log("kussetsu: loading wasm");
      init()
        .then(() => {
          console.log("kussetsu: wasm init done, catalog=", window.__kussetsuCatalog);
          start_kussetsu();
        })
        .catch((err) => {
          console.error("kussetsu: wasm failed", err);
          document.body.insertAdjacentHTML(
            "beforeend",
            `<p style="color:#e8fff0;font:16px system-ui;padding:2rem">Need WebGPU. ${err}</p>`,
          );
        });
    </script>
  </body>
</html>
